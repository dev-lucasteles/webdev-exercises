<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <link rel="stylesheet" href="ex04.css">
    <script src="ex04.js" defer></script> 
</head>
<body>
    <h1> Tabuada </h1>
    <div class="container">
        <div class="box">
            <p class="label">Número:</p>
            <input class="numero" type="number" id="numero1">
        
        <div>
            <p class="label">Número 2:</p>
            <input class="numero" type="number" id="numero2">
        </div>
        <div class="operacoes">
            <button class="botao1" onclick="somar()"> Soma </button>
            <button class="botao1" onclick="subtrair()"> Subtração </button>
            <button class="botao1" onclick="multiplicar()"> Multiplicação </button>
            <button class="botao1" onclick="dividir()"> Divisão </button>
        </div>
        <div>
            <button class="botao" onclick="gerarTabuada()">Gerar Tabuada</button>
        </div>
        <div class="box-resultado">
            <p id="resultado"></p>
        </div>
    </div>
</body>
</html>
